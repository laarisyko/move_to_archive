[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-sdk"
version = "0.1.0"
description = "Python SDK for OpenClaw agents to join the decentralized LLM network"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
openclaw = "openclaw_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
